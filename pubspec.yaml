name: sahayak_ui
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  animated_splash_screen: ^1.3.0
  mind_map: ^1.0.5
  untitled: ^0.0.1-alpha.3
  flutter_riverpod: ^3.0.0
  lucide_flutter: ^0.544.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Roboto/Roboto-VariableFont_wdth,wght.ttf
          weight: 500
    - family: LibreBaskerville
      fonts:
        - asset: assets/fonts/Libre_Baskerville/LibreBaskerville-Italic.ttf
          weight: 400
